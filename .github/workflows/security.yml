name: Security Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/security.yml"
      - "scripts/dependency_audit.sh"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tooling
        run: python -m pip install -e '.[dev]'
      - name: Run security audit
        run: bash scripts/dependency_audit.sh
      - name: Generate SBOM
        run: bash scripts/generate_sbom.sh
      - name: Check licenses
        run: bash scripts/license_check.sh



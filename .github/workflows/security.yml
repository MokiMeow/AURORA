name: Security Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/security.yml"
      - "scripts/dependency_audit.sh"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tooling
        run: python -m pip install -e '.[dev]'
      - name: Run security audit
        run: bash scripts/dependency_audit.sh
      - name: Generate SBOM
        run: bash scripts/generate_sbom.sh
      - name: Check licenses
        run: bash scripts/license_check.sh



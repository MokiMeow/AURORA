name: CI Fast

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast-suite:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy aurora cli

      - name: Tests
        run: python -m pytest

      - name: Installed wheel workspace smoke test
        if: matrix.python-version == '3.12'
        run: |
          wheel_dir="$RUNNER_TEMP/aurora-wheel"
          wheel_venv="$RUNNER_TEMP/aurora-wheel-venv"
          workspace="$RUNNER_TEMP/aurora-workspace"
          empty_dir="$RUNNER_TEMP/aurora-empty"
          python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
          python -m venv --system-site-packages "$wheel_venv"
          wheel_path=$(find "$wheel_dir" -maxdepth 1 -name '*.whl' -print -quit)
          "$wheel_venv/bin/python" -m pip install --force-reinstall --no-deps "$wheel_path"
          "$wheel_venv/bin/aurora-se" init --root "$workspace"
          test -f "$workspace/configs/model.yaml"
          test -f "$workspace/policies/security.yaml"
          test -f "$workspace/prompts/planner_v1.md"
          test -f "$workspace/queries/python.scm"
          test -f "$workspace/scripts/eval_smoke.py"
          mkdir "$empty_dir"
          cd "$empty_dir"
          "$wheel_venv/bin/aurora-se" --help
          test -z "$(find . -mindepth 1 -print -quit)"

      - name: Evaluation CLI smoke test
        run: aurora-se eval run evaluation-smoke --config configs/eval.smoke.yaml

      - name: Dependency inventory
        if: matrix.python-version == '3.12'
        run: |
          bash scripts/generate_sbom.sh
          bash scripts/dependency_audit.sh
          bash scripts/license_check.sh


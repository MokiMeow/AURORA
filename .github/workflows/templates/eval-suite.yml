name: Run Evaluation Suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      python-version:
        required: true
        type: string

jobs:
  run-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[learn]
      - name: Fetch datasets
        run: bash scripts/fetch_swe_bench.sh
      - name: Run evaluation
        run: aurora-se eval --suite ${{ inputs.suite }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite }}-results
          path: |
            eval/results/*${{ inputs.suite }}*.json
            artifacts/eval/**


name: Run Evaluation Suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      python-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install '.[learn]'
      - name: Check evaluation data
        env:
          AURORA_EVAL_SUITE: ${{ inputs.suite }}
        run: bash scripts/fetch_swe_bench.sh "$AURORA_EVAL_SUITE"
      - name: Run evaluation
        env:
          AURORA_EVAL_SUITE: ${{ inputs.suite }}
        run: aurora-se eval run "$AURORA_EVAL_SUITE"
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.suite }}-results
          path: |
            eval/results/*${{ inputs.suite }}*.json
            artifacts/eval/**

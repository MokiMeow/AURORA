name: Run Evaluation Suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      python-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install '.[learn]'
      - name: Check evaluation data
        env:
          AURORA_EVAL_SUITE: ${{ inputs.suite }}
        run: bash scripts/fetch_swe_bench.sh "$AURORA_EVAL_SUITE"
      - name: Run evaluation
        env:
          AURORA_EVAL_SUITE: ${{ inputs.suite }}
        run: aurora-se eval run "$AURORA_EVAL_SUITE"
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.suite }}-results
          path: |
            eval/results/*${{ inputs.suite }}*.json
            artifacts/eval/**

patterns:
  - (?i)api[_-]?key[:=]\s*[A-Za-z0-9]{32,}
  - (?i)secret[:=]\s*[A-Za-z0-9+/]{24,}
replacement: "<REDACTED>"
allow_patterns:
  - TEST_API_KEY
exclude_globs:
  - "docs/**"
external:
  - name: trufflehog
    command:
      - trufflehog
      - filesystem
      - --only-verified
      - {path}
    timeout: 120
  - name: gitleaks
    command:
      - gitleaks
      - detect
      - --source={path}
      - --no-banner
    timeout: 120

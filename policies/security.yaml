ci:
  required_steps:
    - lint
    - unit
    - bandit
    - semgrep
    - sbom_generate
    - cve_scan
    - license_scan
  allow_failures:
    - docs
sbom:
  required: true
cve:
  max_critical: 0
  max_high: 0
licenses:
  allow:
    - Apache-2.0
    - MIT
    - BSD-3-Clause
  deny:
    - GPL-3.0
    - AGPL-3.0

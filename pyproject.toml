[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aurora-se"
version = "0.1.0"
description = "Autonomous Unified Repo Orchestrator for Reasoning & Adaptation — Self-Editing"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "AURORA-SE Team" }
]
keywords = [
  "autonomous", "self-editing", "devops", "pdca", "ci", "swe-bench"
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "rich>=13.7",
  "httpx>=0.27",
  "networkx>=3.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.2.5",
  "tree-sitter==0.20.4",
  "tree-sitter-languages==1.10.2",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp>=1.25",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "plotly>=5.24",
  "docker>=7.1",
  "semver>=3.0",
  "tenacity>=8.3",
  "neo4j>=5.17",
  "prometheus-client>=0.20"
]

[tool.hatch.build.targets.wheel]
packages = ["aurora", "cli"]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=4.3",
  "pip-audit>=2.10.1",
  "pip-licenses>=5.5.5",
  "cyclonedx-bom>=7.3.0"
]
learn = [
  "transformers>=4.45",
  "datasets>=2.19",
  "peft>=0.11",
  "accelerate>=0.33",
  "evaluate>=0.4"
]

[project.scripts]
"aurora-se" = "cli.main:entrypoint"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
minversion = "8.2"
addopts = "-ra -q"
testpaths = ["tests"]


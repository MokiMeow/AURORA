profiles:
  fast:
    steps:
      - name: lint
        command: ["ruff", "check", "."]
      - name: unit
        command: ["pytest"]
      - name: bandit
        command: ["bandit", "-r", "."]
      - name: semgrep
        command: ["semgrep", "--config", "auto"]
    timeout_minutes: 20
    fail_fast: true
  balanced:
    extends: fast
    steps:
      - name: typecheck
        command: ["mypy", "aurora", "cli"]
      - name: coverage
        command: ["pytest", "--cov=aurora", "--cov=cli"]
      - name: chaos_smoke
        command: ["bash", "scripts/chaos_tests.sh"]
      - name: sbom_diff
        command: ["bash", "scripts/sbom_diff.sh"]
    timeout_minutes: 45
    fail_fast: false
  thorough:
    extends: balanced
    steps:
      - name: autopilot_dry_run
        command: ["bash", "scripts/end_to_end_dry_run.sh"]
      - name: fuzz
        command: ["python", "scripts/fuzz_tests.py"]
      - name: dependency_audit
        command: ["bash", "scripts/dependency_audit.sh"]
      - name: license_scan
        command: ["bash", "scripts/license_check.sh"]
      - name: grype_scan
        command: ["bash", "scripts/grype_scan.sh"]
    timeout_minutes: 120
    fail_fast: false

scripts:
  sbom_diff: "scripts/sbom_diff.sh"
  dependency_audit: "scripts/dependency_audit.sh"
  license_check: "scripts/license_check.sh"
  grype_scan: "scripts/grype_scan.sh"

fast:
  steps:
    - name: lint
      command: npm run lint
    - name: unit
      command: pytest
    - name: bandit
      command: bandit -r .
    - name: semgrep
      command: semgrep --config auto
  timeout_minutes: 15
  fail_fast: true
balanced:
  extends: fast
  steps:
    - name: typecheck
      command: mypy aurora
    - name: coverage
      command: pytest --cov=aurora
    - name: k6_smoke
      command: k6 run configs/perf/smoke.js
    - name: sbom_diff
      command: syft packages dir:. -o json > artifacts/sbom.json
  timeout_minutes: 45
  fail_fast: false
thorough:
  extends: balanced
  steps:
    - name: fuzz
      command: python scripts/run_fuzz.py
    - name: k6_endurance
      command: k6 run configs/perf/endurance.js
    - name: dependency_audit
      command: poetry export --format requirements.txt | trivy fs --input -
    - name: license_scan
      command: scripts/license_check.sh
  timeout_minutes: 120
  fail_fast: false

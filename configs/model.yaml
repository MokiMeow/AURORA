primary:
  provider: ollama
  endpoint: http://localhost:11434/api/generate
  model: deepseek-r1:7b
  timeout_seconds: 120
swe_telemetry_path: telemetry/swe_context.json
policy_notes:
  - message: "Refer to latest security briefing"
    path: policies/security.yaml
critic_stack:
  - name: gpt-4o-mini
    endpoint: ${CRITIC_GPT4O_ENDPOINT}
    api_key_env: CRITIC_GPT4O_API_KEY
    enabled: false
  - name: gemini-2.5-pro
    endpoint: ${CRITIC_GEMINI_ENDPOINT}
    api_key_env: CRITIC_GEMINI_API_KEY
    enabled: false
retry_policy:
  max_attempts: 3
  backoff_seconds: 5
secret_redaction:
  enabled: true
  patterns:
    - (?i)api[_-]?key[:=]\s*[A-Za-z0-9]{32,}
    - (?i)secret[:=]\s*[A-Za-z0-9+/]{24,}
experience:
  path: experience/log.jsonl
  limit: 5
routes:
  - name: ollama_primary
    provider: ollama
    endpoint: http://localhost:11434/api/generate
    model: deepseek-r1:7b
    timeout_seconds: 120
    keywords: ["local"]
  - name: openai_precision
    provider: openai
    endpoint: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini
    timeout_seconds: 45
    api_key_env: OPENAI_API_KEY
    keywords: ["compliance", "security"]
  - name: anthropic_guard
    provider: anthropic
    endpoint: https://api.anthropic.com/v1/messages
    model: claude-3-opus
    timeout_seconds: 60
    api_key_env: ANTHROPIC_API_KEY
    max_output_tokens: 1024
routing:
  default_route: ollama_primary
  rules:
    - name: compliance
      route: openai_precision
      keywords:
        - compliance
    - name: security-critical
      route: anthropic_guard
      keywords:
        - security
      auto_only: false
critic_strategy:
  mode: quorum
  threshold: 1
  priority:
    - gpt-4o-mini
    - gemini-2.5-pro

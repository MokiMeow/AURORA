weights:
  tests: 1.0
  coverage: 0.5
  perf: 0.4
  security: 1.5
  complexity: -0.3
  policy: 0.8

adaptive_scheduler:
  window_runs: 20
  adjust_on:
    - failing_tests
    - coverage_regressions
    - security_findings
  min_weight: 0.1
  max_weight: 2.5

bias_penalty:
  enabled: true
  max_delta: 0.05
  penalty_weight: 2.0

explainability:
  store_path: artifacts/reward_reports
  format: json


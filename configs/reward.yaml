weights:
  tests: 1.0
  coverage: 0.5
  perf: 0.4
  security: 1.5
  complexity: -0.3
  policy: 0.8

adaptive_scheduler:
  initial_weights:
    tests: 1.0
    coverage: 0.5
    perf: 0.4
    security: 1.5
    complexity: -0.3
    policy: 0.8
  window_runs: 20
  min_weight: 0.1
  max_weight: 2.5
  adjust_on:
    - failing_tests
    - coverage_regressions
    - security_findings
  strategy: ucb1
  explore_probability: 0.15
  reward_floor: -1.0

bias_penalty:
  enabled: true
  max_delta: 0.05
  penalty_weight: 2.0

explainability:
  store_path: artifacts/reward_reports
  formats:
    - json
    - html
  keep_last: 50
  enable_timeline: true
  html_template: docs/templates/reward_report.html
  history_filename: reward_history.jsonl
  trend_filename: reward_trend.html

acceptance:
  min_reward: 0.0
  require_security_pass: true
  max_bias: 0.05
  enforce_explainability: true

experience_vault:
  log_path: experience/reward.log.jsonl
  index_root: experience/indices
  max_records: 5000
  retention_days: 180
  dedupe_fields:
    - task
    - diff_hash
  redact_fields:
    - secrets
  compress: false

regression_suite:
  enabled: true
  fixtures_path: tests/fixtures/reward_runs
  tolerance: 0.05


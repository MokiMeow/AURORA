name: Evaluate (Monthly)

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

jobs:
  swe-bench-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[learn]
      - name: Fetch datasets
        run: bash scripts/fetch_swe_bench.sh
      - name: Run evaluation
        run: aurora-se eval --suite swe-bench-full
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swe-bench-full-results
          path: |
            eval/results/*full*.json
            artifacts/eval/**

